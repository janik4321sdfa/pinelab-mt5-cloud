name: mt5-probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | login"
        default: "probe"
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install MetaTrader 5 (official MetaQuotes installer)
        shell: pwsh
        run: |
          $t0 = Get-Date
          $ProgressPreference = 'SilentlyContinue'
          try { Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe } catch { "cert problem: $($_.Exception.Message) -> retry without TLS chain check, then verify Authenticode"; Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe -SkipCertificateCheck }
          $sig = Get-AuthenticodeSignature .\mt5setup.exe; "signature: $($sig.Status) $($sig.SignerCertificate.Subject)"; if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'MetaQuotes') { throw 'installer signature invalid' }
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          $exe = "C:\Program Files\MetaTrader 5\terminal64.exe"
          for ($i = 0; $i -lt 120 -and -not (Test-Path $exe); $i++) { Start-Sleep 5 }
          "installed=$(Test-Path $exe) after $([int]((Get-Date)-$t0).TotalSeconds) s"
          for ($i = 0; $i -lt 60 -and (Get-Process mt5setup -ErrorAction SilentlyContinue); $i++) { Start-Sleep 5 }
          Start-Sleep 20
          Get-Process | ? { $_.Name -match "terminal|mt5" } | Select Name,Id,SessionId | Format-Table | Out-String
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
      - name: python deps
        run: pip install MetaTrader5 numpy; python -c "import MetaTrader5 as m; print(m.__version__)"
      - name: probe
        env:
          MT5_SERVERS_1: ${{ secrets.MT5_SERVERS_1 }}
          MT5_SERVERS_2: ${{ secrets.MT5_SERVERS_2 }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MODE: ${{ github.event.inputs.mode }}
        run: python probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
