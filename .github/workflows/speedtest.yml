name: net-speedtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speed:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: download / upload speed
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $curl = if ($IsWindows) { 'curl.exe' } else { 'curl' }
          $nul  = if ($IsWindows) { 'NUL' } else { '/dev/null' }
          "RUNNER: $env:RUNNER_OS | $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription) | CPU $([Environment]::ProcessorCount) | image $env:ImageOS $env:ImageVersion"
          try { $ip = Invoke-RestMethod https://ipinfo.io/json -TimeoutSec 10; "LOCATION: $($ip.city), $($ip.region), $($ip.country) | $($ip.org)" } catch { "LOCATION: ipinfo failed" }
          & $curl --version | Select-Object -First 1
          $tests = @(
            @('Cloudflare CDN 100MB',        'https://speed.cloudflare.com/__down?bytes=100000000'),
            @('Hetzner Ashburn US 100MB',    'https://ash-speed.hetzner.com/100MB.bin'),
            @('Hetzner Falkenstein DE 100MB','https://fsn1-speed.hetzner.com/100MB.bin'),
            @('Tele2 EU 100MB',              'http://speedtest.tele2.net/100MB.zip'),
            @('MetaQuotes mt5setup.exe',     'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe')
          )
          $rows = @()
          foreach ($t in $tests) {
            for ($i = 1; $i -le 2; $i++) {
              $w = & $curl -s -k -L --max-time 60 -o $nul -w "%{http_code} %{size_download} %{speed_download} %{time_connect} %{time_total}" $t[1]
              $p = $w -split ' '
              $mbit = [math]::Round([double]$p[2] * 8 / 1e6, 0)
              $row = "DL | {0,-30} | run {1} | http {2} | {3,6:N1} MB | {4,6} Mbit/s | connect {5,6:N0} ms | total {6,5:N1} s" -f $t[0], $i, $p[0], ([double]$p[1]/1e6), $mbit, ([double]$p[3]*1000), [double]$p[4]
              $row; $rows += $row
            }
          }
          $t0 = Get-Date
          $jobs = 1..4 | ForEach-Object { Start-ThreadJob -ScriptBlock { param($c,$n) & $c -s --max-time 60 -o $n -w "%{size_download}" "https://speed.cloudflare.com/__down?bytes=100000000" } -ArgumentList $curl, $nul }
          $sizes = $jobs | Wait-Job | Receive-Job
          $sec = ((Get-Date) - $t0).TotalSeconds
          $tot = ($sizes | ForEach-Object { [double]$_ } | Measure-Object -Sum).Sum
          $row = "DL | Cloudflare 4 parallel x100MB | {0:N0} MB in {1:N1} s | {2:N0} Mbit/s aggregate" -f ($tot/1e6), $sec, ($tot*8/1e6/$sec); $row; $rows += $row
          $f = Join-Path $env:RUNNER_TEMP 'up.bin'; $b = New-Object byte[] 25000000; (New-Object Random 1).NextBytes($b); [IO.File]::WriteAllBytes($f, $b)
          for ($i = 1; $i -le 2; $i++) {
            $w = & $curl -s --max-time 60 -o $nul -X POST --data-binary "@$f" -w "%{http_code} %{size_upload} %{speed_upload} %{time_total}" https://speed.cloudflare.com/__up
            $p = $w -split ' '
            $row = "UP | Cloudflare 25MB run $i | http $($p[0]) | {0:N0} Mbit/s | total {1:N1} s" -f ([double]$p[2]*8/1e6), [double]$p[3]; $row; $rows += $row
          }
          "## $env:RUNNER_OS speed`n" + (($rows | ForEach-Object { "- $_" }) -join "`n") | Out-File $env:GITHUB_STEP_SUMMARY -Append
